<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BuildProof — 看懂 Agent 构建的系统</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <style>.article-link{color:#aeb4ab;text-decoration:none;margin:22px 10px}.article-link:hover{color:#fff}</style>
    <style>.chain{display:grid;grid-template-columns:1fr 22px 1fr 22px 1fr 22px 1fr;align-items:center;gap:6px;padding:12px 0;border-top:1px solid #e9e9e3}.chain:first-child{border-top:0}.chain>div{display:grid;min-width:0}.chain small{color:#6c716b}.chain i{text-align:center;color:#4d5cf0;font-style:normal}</style>
    <style>.history-title{margin:28px 10px 9px;color:#697066;font-size:11px;font-weight:800;letter-spacing:.12em}.history{display:grid;gap:5px;max-height:36vh;overflow:auto}.history button{border:0;background:transparent;color:#aeb4ab;text-align:left;padding:9px 11px;border-radius:8px;cursor:pointer;display:grid}.history button:hover,.history button.active{background:#262a23;color:#fff}.history small{color:#737970}.history>span{color:#737970;padding:8px 11px;font-size:12px}</style>
  </head>
  <body>
    <div class="shell">
      <aside>
        <div class="brand"><span class="mark">B</span><div><b>BuildProof</b><small>Code intelligence</small></div></div>
        <nav>
          <button class="active" data-view="overview">系统总览</button>
          <button data-view="surfaces">Web 暴露面</button>
          <button data-view="domains">业务能力</button>
          <button data-view="endpoints">API 清单</button>
          <button data-view="supplychain">软件供应链</button>
        </nav>
        <div class="history-title">已分析项目</div>
        <div id="history" class="history"><span>正在加载…</span></div>
        <a class="article-link" href="/articles">文章与研究 →</a>
        <div class="aside-note">图数据库已隐藏。所有结论都附源码证据。</div>
      </aside>
      <main>
        <header>
          <div><p class="eyebrow">AI-GENERATED CODE ANALYSIS</p><h1 id="title">系统总览</h1></div>
          <form id="analyze-form">
            <input id="repo" type="url" placeholder="https://github.com/owner/repo" />
            <button>分析项目</button>
          </form>
        </header>
        <div id="status" class="status">输入公开 GitHub 仓库地址，直接查看页面、API 与调用关系。</div>
        <section id="content"></section>
      </main>
    </div>
    <script src="/assets/app.js"></script>
  </body>
</html>
